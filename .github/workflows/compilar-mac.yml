name: Compilar aplicación para Mac

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Instalar herramientas para Mac
        run: dotnet workload install maui-maccatalyst

      - name: Crear aplicación universal
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=$(find . -name SistemaNacoMac.csproj -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "ERROR: falta SistemaNacoMac.csproj"
            exit 1
          fi

          DIR=$(dirname "$PROJECT")
          ICON="$DIR/Resources/AppIcon/sistema_naco.png"
          if [ ! -f "$ICON" ]; then
            echo "ERROR: falta el icono $ICON"
            exit 1
          fi

          dotnet publish "$PROJECT" \
            -f net10.0-maccatalyst \
            -c Release \
            --self-contained true \
            -p:CreatePackage=false \
            -p:EnableCodeSigning=false \
            -p:EnablePackageSigning=false

      - name: Preparar ZIP y DMG
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find . -type d -name 'Sistema NACO.app' \
            -path '*/bin/Release/*' -print -quit)

          if [ -z "$APP" ]; then
            APP=$(find . -type d -name '*.app' \
              -path '*/bin/Release/*' -print -quit)
          fi

          if [ -z "$APP" ]; then
            echo "ERROR: no se generó la aplicación .app"
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" Sistema-NACO-Mac.zip

          mkdir -p dmg-contenido
          ditto "$APP" "dmg-contenido/Sistema NACO.app"
          ln -s /Applications "dmg-contenido/Aplicaciones"
          hdiutil create \
            -volname "Sistema NACO" \
            -srcfolder dmg-contenido \
            -ov \
            -format UDZO \
            Sistema-NACO-Mac.dmg

      - name: Guardar aplicación
        uses: actions/upload-artifact@v4
        with:
          name: Sistema-NACO-Mac-V11-8
          path: |
            Sistema-NACO-Mac.dmg
            Sistema-NACO-Mac.zip
          if-no-files-found: error
